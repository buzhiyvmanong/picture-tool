name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/PictureTool.Tests/PictureTool.Tests.csproj -c Release --verbosity normal

      - name: Publish
        run: dotnet publish src/PictureTool/PictureTool.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish/win-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/win-x64/PictureTool.exe
          generate_release_notes: true
          draft: false
          prerelease: false
